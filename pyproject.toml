[tool.ruff]
target-version = "py310"
line-length = 200

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",           # pycodestyle errors
    "F",                        # pyflakes
    "UP006", "UP007", "UP045",  # modern type annotation syntax (list, X | Y, X | None)
    "RUF013",                   # implicit Optional in signatures
]

[tool.mypy]
python_version = "3.10"
files = ["hacktools"]
ignore_missing_imports = true
# Body-level inference checks disabled for now
disable_error_code = [
    "union-attr",
    "index",
    "attr-defined",
    "assignment",
    "arg-type",
    "annotation-unchecked",
]
